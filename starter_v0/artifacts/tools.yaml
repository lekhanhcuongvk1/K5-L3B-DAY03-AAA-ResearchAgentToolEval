# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc (như thiếu handle khi xem timeline, thiếu URL khi đọc bài viết), hoặc để xin xác nhận (yes_no) trước khi thực hiện hành động gửi đi (send). KHÔNG dùng khi đã có đủ thông tin hoặc đã có URL cụ thể."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần làm rõ hoặc câu hỏi xin xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' để lấy thông tin thiếu, 'yes_no' để xin xác nhận trước khi gửi"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter/X cụ thể (ví dụ: Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy). KHÔNG dùng để tìm kiếm theo chủ đề chung."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle Twitter của người dùng KHÔNG bao gồm ký tự '@' (ví dụ: 'sama', 'elonmusk', 'karpathy')"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng trên Twitter/X theo từ khóa hoặc chủ đề bàn luận. Dùng khi tìm tweet theo chủ đề. KHÔNG dùng khi xem bài đăng của 1 người cụ thể, hoặc khi người dùng yêu cầu bỏ Twitter/chỉ tìm trên web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề cần tìm kiếm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Latest' cho bài mới nhất, 'Top' cho bài nổi bật/phổ biến"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên internet qua web search. Dùng khi tìm kiếm thông tin chung hoặc tin tức thời sự trên web. KHÔNG đưa từ khóa 'news' vào query mà hãy chọn topic='news'."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa truy vấn sạch, không chứa từ 'news'"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức báo chí/thời sự, 'general' cho thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này, 'month' cho tháng này"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Đọc và trích xuất nội dung từ một địa chỉ URL web cụ thể. DÙNG NGAY khi người dùng cung cấp link URL (ví dụ: 'https://...'). KHÔNG cần hỏi lại clarify khi đã có URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ cần đọc (ví dụ: 'https://openai.com/blog/gpt-5')"}
      required: [url]

  - name: format
    description: "Trình bày danh sách dữ liệu đã có thành văn bản markdown digest tóm tắt. Dùng khi đã có danh sách items cần format."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item cần định dạng"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu format"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung văn bản lên kênh Telegram hoặc xuất bản ra bên ngoài. CHỈ GỌI khi người dùng ĐÃ XÁC NHẬN đồng ý gửi (confirmed=true). Nếu chưa có xác nhận từ người dùng, KHÔNG được gọi send mà phải dùng clarify hỏi trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận, chỉ đặt true khi người dùng đã xác nhận đồng ý gửi"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ (company policy). Dùng khi hỏi về chính sách bảo mật, trích dẫn nguồn, xuất bản ra ngoài của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm chính sách"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục kết quả"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học nghiên cứu trên arXiv theo từ khóa."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm paper"}
        max_results: {type: integer, default: 5, description: "Số lượng paper tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất nội dung văn bản từ một bài báo arXiv qua ID hoặc URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID (ví dụ: '1706.03762') hoặc URL của bài báo"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]

  # ---------------- Team tool (CP3) ----------------
  - name: doi_lookup
    description: "Tra metadata bài báo trên Crossref khi user cung cấp DOI cụ thể và cần tiêu đề, tác giả, nhà xuất bản hoặc năm xuất bản. Nhận DOI thuần, tiền tố doi: hoặc URL doi.org. KHÔNG dùng để tìm paper theo từ khóa (papers), đọc toàn văn arXiv (paper_text) hoặc đọc URL web thông thường (fetch). Nếu thiếu DOI, dùng clarify hỏi lại; không tự đoán."
    parameters:
      type: object
      properties:
        doi: {type: string, default: "", description: "DOI cụ thể, ví dụ '10.1038/nphys1170' hoặc 'https://doi.org/10.1038/nphys1170'; không truyền từ khóa hay URL web thông thường"}
      required: [doi]
